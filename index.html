<!DOCTYPE HTML>

<html>
    <head>
        <meta charset="utf-8">
        <title>Unit 2 Project</title>
        <style>
            body {
                background-color: cyan;
                color: rgb(25, 2, 88);
                transition: background-color 1.2s ease;
            }

            body.pink-background {
                background-color: pink;
            }

            @media (prefers-reduced-motion: reduce) {
                body {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <h1>THE PORTAPOTTY</h1>
        <h5>A TRAVEL GUIDE BY JACKSON VITALE</h5>
        <img src="https://cdn.unitedsiteservices.com/wp-content/smush-webp/2024/04/ADA-portable-toilet-interior-blue-scaled-1.jpg.webp" width="300">
        <br>
        <br>
        Do you want to know the best places to find a portapotty? Well, look no further! This travel guide will help you find the best portapotties in the world.
        <br>
        <br>
        <br>
        <img id="second-image" src="https://cdnimg.webstaurantstore.com/images/products/large/448773/1665814.jpg" width="300">
        <script>
            const secondImage = document.getElementById("second-image");
            const backgroundObserver = new IntersectionObserver(([entry]) => {
                document.body.classList.toggle("pink-background", entry.isIntersecting);
            }, { threshold: 0.35 });

            backgroundObserver.observe(secondImage);
        </script>
    </body>
</html>
